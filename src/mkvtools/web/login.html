<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MKVTOOLS — Đăng nhập</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config={darkMode:"class",theme:{extend:{
    colors:{"background":"#131315","surface-container-low":"#1c1b1d","surface-container-lowest":"#0e0e10","on-surface":"#e5e1e4","on-surface-variant":"#b9cacb","outline-variant":"#3a494b","primary-fixed-dim":"#00dbe7","primary-fixed":"#74f5ff","on-primary-fixed":"#002022","error":"#ffb4ab"},
    borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
    spacing:{"unit":"4px","stack-sm":"8px","gutter":"16px","stack-md":"16px","panel-padding":"24px","stack-lg":"32px"},
    fontFamily:{"headline":["Sora"],"body":["Inter"],"label":["JetBrains Mono"]},
    fontSize:{"label-xs":["10px",{letterSpacing:"0.1em",fontWeight:"700"}],"label-sm":["12px",{letterSpacing:"0.05em",fontWeight:"500"}],"body-md":["15px",{lineHeight:"22px"}],"headline-lg":["30px",{fontWeight:"700"}]}
  }}}
</script>
<style>
  .glass-panel{background:linear-gradient(135deg,rgba(20,20,23,.8),rgba(10,10,12,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(58,73,75,.3);border-top-color:rgba(255,255,255,.05)}
  .input-glow:focus-within{box-shadow:0 2px 12px -2px rgba(0,242,255,.4);border-color:#00f2ff}
  .ms{font-family:'Material Symbols Outlined';line-height:1;display:inline-block}
</style>
</head>
<body class="font-body bg-background text-on-surface min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top,_rgba(0,219,231,0.06),_transparent_60%)]">
  <div class="w-full max-w-[380px] px-gutter">
    <div class="text-center mb-stack-lg">
      <h1 class="font-headline text-headline-lg text-primary-fixed-dim tracking-tight">MKVTOOLS</h1>
      <p class="font-label text-label-sm text-on-surface-variant uppercase tracking-[0.2em] mt-unit">Command Center</p>
    </div>
    <div class="glass-panel rounded-xl p-panel-padding">
      <h2 class="font-headline text-xl font-semibold mb-stack-md">Đăng nhập</h2>
      <div id="err" class="hidden mb-stack-md text-sm text-error bg-error/10 border border-error/30 rounded-lg px-gutter py-stack-sm"></div>
      <form method="post" action="/login" class="flex flex-col gap-stack-md">
        <div class="input-glow border border-outline-variant rounded-lg bg-surface-container-lowest px-gutter py-stack-sm transition-colors">
          <label class="font-label text-label-xs text-primary-fixed-dim uppercase tracking-widest">Tên đăng nhập</label>
          <input name="username" autofocus required autocomplete="username" class="bg-transparent border-none text-on-surface w-full p-0 mt-1 focus:ring-0 placeholder-on-surface-variant/40" placeholder="admin"/>
        </div>
        <div class="input-glow border border-outline-variant rounded-lg bg-surface-container-lowest px-gutter py-stack-sm transition-colors">
          <label class="font-label text-label-xs text-primary-fixed-dim uppercase tracking-widest">Mật khẩu</label>
          <input name="password" type="password" required autocomplete="current-password" class="bg-transparent border-none text-on-surface w-full p-0 mt-1 focus:ring-0 placeholder-on-surface-variant/40" placeholder="••••••••"/>
        </div>
        <button type="submit" class="mt-unit h-11 bg-primary-fixed-dim text-on-primary-fixed font-label text-label-sm uppercase tracking-wider rounded-lg hover:bg-primary-fixed transition-colors flex items-center justify-center gap-unit shadow-[0_0_15px_rgba(0,219,231,.4)]">
          <span class="ms text-[18px]" style="font-variation-settings:'FILL' 1">login</span> Đăng nhập</button>
      </form>
    </div>
  </div>
<script>
  const e=new URLSearchParams(location.search).get('err');
  if(e){ const b=document.getElementById('err'); b.textContent=e; b.classList.remove('hidden'); }
</script>
</body></html>
