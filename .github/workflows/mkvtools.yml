name: mkvtools CI

on:
  push:
    branches: [ main, develop, "feat/**" ]
    paths:
      - "src/mkvtools/**"
      - "tests/test_splitter.py"
      - "pyproject.toml"
      - ".github/workflows/mkvtools.yml"
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: lint + test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
        shell: pwsh

      - name: Install core only (split-only deps)
        run: python -m pip install --upgrade pip && pip install -e .
        shell: bash

      - name: Core stays minimal — cli/pipeline import WITHOUT google/fastapi
        run: |
          python -c "import mkvtools, mkvtools.cli, mkvtools.pipeline, mkvtools.splitter, mkvtools.config; print('core import OK', mkvtools.__version__)"
          mkvtools --help
        shell: bash

      - name: Install full (all extras + dev)
        run: pip install -e ".[all,dev]"
        shell: bash

      - name: Lint (ruff)
        run: ruff check src/mkvtools

      - name: Full import (upload + web deps resolve cross-platform)
        run: python -c "import mkvtools.uploader, mkvtools.webui; print('full import OK')"

      - name: Unit tests (no ffmpeg needed)
        run: pytest tests/test_splitter.py tests/test_idempotency.py tests/test_resources.py tests/test_pipeline_idempotency.py tests/test_config.py tests/test_webui_auth.py
