# Copy thanh config.yaml roi sua.
client_secret: secrets/client_secret.json
token_file: secrets/token.json

inbox_dir: inbox
work_dir: work
done_dir: done
cleanup_outputs: true
upload: true                 # false = chi tach, khong upload

privacy: private             # private | unlisted | public
category_id: 22
subtitle_mode: caption       # caption | burn | both
captions: all                # all = up MOI phu de chu (moi ngon ngu) | paired = chi sub cung lang audio
container: mp4               # mp4 (cast/upload) | mkv (giu attachment/font)
audio_per_lang: best         # best = moi ngon ngu 1 audio tot nhat (kenh/codec) | all = giu het
make_playlist: true
default_caption_lang: vi
description: ""
tags: []

# Tieu de YouTube. Placeholder: {res} {lang} {year} {title}(da chuan hoa, sach) {label} {base}(ten tho)
# Vi du khac:  "[{res}][{lang}] {title} ({year})"  hoac  "{res} | {lang} | {year} | {title}"
title_template: "{res}_{lang}_{year}_{title}"
playlist_template: "{title} ({year})"

watch_ext: [".mkv", ".mp4", ".ts", ".mov", ".webm"]
poll_seconds: 10

# Chong xu ly trung (theo chu ky noi dung file). watch nho qua restart nho file nay.
skip_processed: true
state_file: work/processed.json
# An toan dia: canh bao neu free < kich_thuoc_file * he_so truoc khi tach.
min_free_gb_factor: 1.5

# Chong trung theo TUA DE: nhe (chi doc ten file), phan biet Phan 1/2/3 (tua khac nhau)
# nhung bat ban re-encode (cung tua). Dung 'mkvtools sync-titles' de keo tua da upload
# tren YouTube vao index. on_title_match: skip (bo qua) | warn (chi bao, van xu ly).
dedup_by_title: true
on_title_match: skip
# Da co phim roi nhung ban moi do phan giai CAO HON (vd co 1080p, moi la 2160p) -> van up.
upgrade_on_higher_res: true

# Proxy cho upload + API YouTube (de trong = khong dung). Ho tro http/https/socks5/socks4:
#   proxy: http://127.0.0.1:8080
#   proxy: socks5://user:pass@host:1080
proxy: ""

# --- Tai tu link (GUI dan link / `mkvtools fetch <url>`) + XOAY VONG DIA ---
# Thu vien o tren YouTube, dia local chi la ban lam viec tam: xu ly tuan tu tung
# link, xoa nguon ngay sau khi upload -> dia chi can chua ~1 phim => o nho van du.
downloads_dir: inbox          # noi tai link ve (mac dinh chung inbox)
delete_source: false          # true = XOA file nguon sau khi upload (o nho) thay vi chuyen done/
min_free_gb: 5                 # doi du chung nay GB trong moi tai link tiep (rotation). 0 = tat
# (GUI khi chay hang doi link luon bat delete_source de xoay vong, du day de false.)

# --- Dang nhap GUI (login + phan quyen admin/user) ---
# Tai khoan luu o file nay (JSON, mat khau bam pbkdf2). Lan dau chua co user nao,
# server tu tao admin: dat truoc MKV_ADMIN_USER / MKV_ADMIN_PASS, hoac de trong
# thi server sinh mat khau ngau nhien va IN RA CONSOLE (nho doi sau khi dang nhap).
users_file: secrets/users.json

# --- Bat link thong minh (4 tang): direct -> yt-dlp -> trinh duyet sniff -> cookie ---
# Cookie cho trang CAN DANG NHAP (xuat tu trinh duyet ra cookies.txt dinh dang Netscape).
# De trong = khong dung. Tang "sniff" can extra [browser]: pip install 'mkvtools[browser]'
# && playwright install chromium. Lenh thu link khong tai:  mkvtools resolve <url>
cookies_file: ""
