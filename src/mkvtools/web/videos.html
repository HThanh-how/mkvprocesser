<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MKVTOOLS — Video</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config={darkMode:"class",theme:{extend:{
    colors:{"surface-container-low":"#1c1b1d","surface-container-highest":"#353437","surface-container":"#201f21","surface-container-high":"#2a2a2c","surface-container-lowest":"#0e0e10","surface-variant":"#353437","primary-container":"#00f2ff","on-surface":"#e5e1e4","on-background":"#e5e1e4","background":"#131315","surface":"#131315","outline":"#849495","outline-variant":"#3a494b","on-surface-variant":"#b9cacb","primary-fixed-dim":"#00dbe7","primary-fixed":"#74f5ff","on-primary-fixed":"#002022","error":"#ffb4ab","error-container":"#93000a","ok":"#00e75b","warn":"#f5b32b","secondary":"#bbc3ff"},
    borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},
    spacing:{"unit":"4px","stack-sm":"8px","gutter":"16px","stack-md":"16px","panel-padding":"24px","stack-lg":"32px","container-margin":"32px"},
    fontFamily:{"headline-md":["Sora"],"body-md":["Inter"],"label-sm":["JetBrains Mono"],"label-xs":["JetBrains Mono"]},
    fontSize:{"label-xs":["10px",{lineHeight:"12px",letterSpacing:"0.1em",fontWeight:"700"}],"label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"500"}],"body-md":["15px",{lineHeight:"22px"}],"headline-md":["22px",{lineHeight:"30px",fontWeight:"600"}]}
  }}}
</script>
<style>
  .glass-panel{background:linear-gradient(135deg,rgba(20,20,23,.8),rgba(10,10,12,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(58,73,75,.3);border-top-color:rgba(255,255,255,.05)}
  .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
  .ms{font-family:'Material Symbols Outlined';line-height:1;display:inline-block}
</style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden">
<nav id="shell-side" class="w-[280px] h-screen fixed left-0 top-0 bg-surface-container-low border-r border-outline-variant/30 shadow-2xl z-50 flex flex-col py-panel-padding"></nav>
<header id="shell-top" class="fixed top-0 right-0 left-[280px] h-16 bg-surface/70 backdrop-blur-md border-b border-outline-variant/20 z-40 flex items-center justify-between px-container-margin"></header>

<main class="ml-[280px] mt-16 p-container-margin h-[calc(100vh-64px)] overflow-y-auto scrollbar-hide">
  <div class="flex items-center justify-between mb-stack-md flex-wrap gap-stack-sm">
    <div class="flex items-center gap-stack-sm">
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Thư viện video đã upload</span>
      <span id="vcount" class="font-label-xs text-label-xs bg-surface-variant text-on-surface-variant px-2 py-1 rounded-full">…</span>
    </div>
    <div class="flex items-center gap-stack-sm">
      <input id="vsearch" placeholder="Tìm tựa…" class="h-9 px-gutter rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface text-sm focus:outline-none focus:border-primary-fixed-dim placeholder-on-surface-variant/40">
      <button id="vrefresh" class="h-9 px-gutter rounded-lg bg-surface-container-high text-on-surface-variant hover:text-primary-fixed-dim transition-colors flex items-center gap-unit font-label-sm text-label-sm uppercase"><span class="ms text-[16px]">refresh</span>Tải lại</button>
    </div>
  </div>

  <div id="vstate" class="text-on-surface-variant text-sm py-stack-lg text-center">Đang tải danh sách video…</div>
  <div id="vgrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-stack-md"></div>
</main>

<script src="/web/shell.js"></script>
<script>
MKVShell('videos','Video');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ALL=[];
function pill(p){
  if(p==='private') return '<span class="font-label-xs text-label-xs px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant flex items-center gap-1"><span class="ms text-[12px]">lock</span>riêng tư</span>';
  if(p==='unlisted') return '<span class="font-label-xs text-label-xs px-2 py-0.5 rounded-full bg-warn/15 text-warn">không công khai</span>';
  if(p==='public') return '<span class="font-label-xs text-label-xs px-2 py-0.5 rounded-full bg-ok/15 text-ok">công khai</span>';
  return '<span class="font-label-xs text-label-xs px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant">'+esc(p||'?')+'</span>';
}
function card(v){
  const date=(v.published||'').slice(0,10);
  const studio='https://studio.youtube.com/video/'+v.id+'/edit';
  const thumb=v.thumb?`<img src="${esc(v.thumb)}" class="w-full aspect-video object-cover" loading="lazy">`
    :'<div class="w-full aspect-video bg-surface-container-high flex items-center justify-center text-on-surface-variant"><span class="ms text-[32px]">movie</span></div>';
  return `<div class="glass-panel rounded-xl overflow-hidden flex flex-col group">
    <a href="${esc(v.url)}" target="_blank" class="relative block">${thumb}
      <span class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity"><span class="ms text-[40px] text-white">play_circle</span></span></a>
    <div class="p-stack-md flex flex-col gap-stack-sm flex-1">
      <div class="text-on-surface text-sm font-medium line-clamp-2" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(v.title)}</div>
      <div class="flex items-center justify-between mt-auto">${pill(v.privacy)}<span class="font-label-xs text-label-xs text-on-surface-variant">${date}</span></div>
      <div class="flex gap-stack-sm">
        <a href="${esc(v.url)}" target="_blank" class="flex-1 h-8 rounded-lg bg-primary-fixed-dim text-on-primary-fixed font-label-sm text-label-sm uppercase flex items-center justify-center gap-unit hover:bg-primary-fixed transition-colors"><span class="ms text-[16px]">play_arrow</span>Mở</a>
        <a href="${studio}" target="_blank" class="h-8 px-gutter rounded-lg bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-unit text-sm" title="Sửa trên YouTube Studio"><span class="ms text-[16px]">edit</span></a>
      </div>
    </div></div>`;
}
function render(list){
  $('vgrid').innerHTML=list.map(card).join('');
  $('vcount').textContent=list.length+(list.length!==ALL.length?('/'+ALL.length):'');
}
function applyFilter(){
  const q=$('vsearch').value.trim().toLowerCase();
  render(q?ALL.filter(v=>(v.title||'').toLowerCase().includes(q)):ALL);
}
async function load(){
  $('vstate').textContent='Đang tải danh sách video…'; $('vstate').style.display='';
  $('vgrid').innerHTML='';
  let d; try{ d=await (await fetch('/videos/list',{cache:'no-store'})).json(); }
  catch(e){ $('vstate').textContent='Lỗi tải danh sách.'; return; }
  if(!d.ok){ $('vstate').innerHTML='<span class="text-error">'+esc(d.error||'Lỗi')+'</span>'; return; }
  ALL=d.videos||[];
  if(!ALL.length){ $('vstate').textContent='Chưa có video nào trên kênh.'; return; }
  $('vstate').style.display='none'; applyFilter();
}
$('vrefresh').onclick=load;
$('vsearch').oninput=applyFilter;
load();
</script>
</body></html>
