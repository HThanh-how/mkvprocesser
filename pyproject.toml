[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvtools"
version = "3.0.0"
description = "Split multi-audio video into per-audio files + extract subtitles + optional YouTube upload (cross-platform, headless, with web GUI)"
readme = "docs/mkvtools.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mkvprocesser contributors" }]
keywords = ["ffmpeg", "mkv", "video", "subtitle", "youtube", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Video",
]

# Core runtime deps: split-only. Heavier integrations are opt-in extras below and
# are lazy-imported, so a headless "split + extract subs" install stays tiny.
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# YouTube upload integration (lazy-imported; only needed when uploading).
upload = [
  "google-api-python-client>=2.120.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  "google-auth-httplib2>=0.2.0",
]
# Web GUI (FastAPI) — required by the `mkvtools-gui` entry point.
# jinja2: render HTML server-side voi autoescape (xem mkvtools/templating.py).
web = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
]
# Tai tu link (yt-dlp): YouTube / trang stream / file-host / link truc tiep.
# Lazy-imported, chi can khi dung `mkvtools fetch` hoac hang doi link tren GUI.
fetch = [
  "yt-dlp>=2024.8.0",
]
# Tang "sniff" bang trinh duyet an (Playwright) cho player JS/obfuscate ma yt-dlp
# generic bo tay. Sau khi pip install, chay: playwright install chromium
browser = [
  "playwright>=1.40",
]
# Cache Redis (tiet kiem quota YouTube). Khong cai -> tu dong dung cache file.
cache = [
  "redis>=5.0",
]
# Everything needed for the full headless tool (upload + web GUI + fetch + sniff + cache).
all = [
  "mkvtools[upload,web,fetch,browser,cache]",
]
# Legacy PySide6 desktop GUI + resource probing (opt-in; not needed headless).
desktop = [
  "PySide6>=6.7.0",
  "psutil>=5.9.0",
  "ffmpeg-python>=0.2.0",
  "requests>=2.31.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "httpx>=0.27",
]

[project.scripts]
mkvtools = "mkvtools.cli:main"
mkvtools-gui = "mkvtools.webui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mkvtools*"]

[tool.setuptools.package-data]
mkvtools = ["web/*.html", "web/*.js", "web/*.css", "templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines are tolerated in HTML/template-adjacent code.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI khai bao tham so bang Form()/File()/Depends() trong default — do la
# idiom cua framework, khong phai loi "mutable default" ma B008 muon bat.
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form",
  "fastapi.Header", "fastapi.Path", "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
