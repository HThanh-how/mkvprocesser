<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MKVTOOLS — Short</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: {
    colors: {
      "surface-container-low":"#1c1b1d","surface-container-highest":"#353437","surface-container":"#201f21",
      "surface-container-high":"#2a2a2c","surface-container-lowest":"#0e0e10","surface-variant":"#353437",
      "primary-container":"#00f2ff","on-surface":"#e5e1e4","on-background":"#e5e1e4","background":"#131315",
      "surface":"#131315","outline":"#849495","outline-variant":"#3a494b","on-surface-variant":"#b9cacb",
      "primary-fixed-dim":"#00dbe7","primary-fixed":"#74f5ff","on-primary-fixed":"#002022",
      "error":"#ffb4ab","error-container":"#93000a","secondary":"#bbc3ff",
      "ok":"#00e75b","warn":"#f5b32b","split":"#d1bcff"
    },
    borderRadius:{ "DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px" },
    spacing:{ "unit":"4px","stack-sm":"8px","gutter":"16px","stack-md":"16px","panel-padding":"24px","stack-lg":"32px","container-margin":"32px" },
    fontFamily:{ "headline-md":["Sora"],"headline-lg":["Sora"],"body-md":["Inter"],"label-sm":["JetBrains Mono"],"label-xs":["JetBrains Mono"] },
    fontSize:{
      "label-xs":["10px",{lineHeight:"12px",letterSpacing:"0.1em",fontWeight:"700"}],
      "label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"500"}],
      "body-md":["15px",{lineHeight:"22px",fontWeight:"400"}],
      "headline-md":["22px",{lineHeight:"30px",fontWeight:"600"}],
      "headline-lg":["30px",{lineHeight:"38px",letterSpacing:"-0.01em",fontWeight:"700"}]
    }
  }}}
</script>
<style>
  .glass-panel{background:linear-gradient(135deg,rgba(20,20,23,.8),rgba(10,10,12,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(58,73,75,.3);border-top-color:rgba(255,255,255,.05);border-left-color:rgba(255,255,255,.05)}
  .neon-text-glow{text-shadow:0 0 8px rgba(0,242,255,.5)}
  .input-glow:focus-within{box-shadow:0 2px 12px -2px rgba(0,242,255,.4);border-color:#00f2ff}
  .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
  .ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
</style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-fixed">

<nav id="shell-side" class="w-[280px] h-screen fixed left-0 top-0 bg-surface-container-low border-r border-outline-variant/30 shadow-2xl z-50 flex flex-col py-panel-padding"></nav>
<header id="shell-top" class="fixed top-0 right-0 left-[280px] h-16 bg-surface/70 backdrop-blur-md border-b border-outline-variant/20 z-40 flex items-center justify-between px-container-margin"></header>

<main class="ml-[280px] mt-16 p-container-margin h-[calc(100vh-64px)] overflow-y-auto scrollbar-hide bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-background to-background">

  <!-- Input -->
  <div class="mb-stack-lg glass-panel p-panel-padding rounded-xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-1 h-full bg-primary-fixed-dim shadow-[0_0_15px_#00dbe7]"></div>
    <div class="relative z-10">
      <label class="font-label-xs text-label-xs text-primary-fixed-dim uppercase tracking-widest">Dán link video ngắn — mỗi dòng 1 link (Threads · Reels · TikTok · YouTube Short · .mp4)</label>
      <textarea id="links" rows="3" class="mt-stack-sm w-full input-glow border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md p-gutter focus:ring-0 placeholder-on-surface-variant/40 resize-none" placeholder="https://www.threads.com/...&#10;https://..."></textarea>
      <div class="mt-stack-md flex items-center justify-between flex-wrap gap-stack-sm">
        <span class="font-label-xs text-label-xs text-on-surface-variant">Dán link rồi bấm — hệ thống liệt kê các clip để bạn chọn Tải về máy hoặc Up YouTube Short.</span>
        <button id="btnProbe" class="h-11 px-stack-lg bg-primary-fixed-dim text-on-primary-fixed font-label-sm text-label-sm uppercase tracking-wider rounded-lg hover:bg-primary-fixed transition-colors flex items-center gap-unit shadow-[0_0_15px_rgba(0,219,231,.4)]">
          <span class="ms text-[18px]" style="font-variation-settings:'FILL' 1">search</span> Tìm video</button>
      </div>
    </div>
  </div>

  <!-- Job list -->
  <section class="glass-panel rounded-xl overflow-hidden flex flex-col min-h-[300px]">
    <div class="px-panel-padding py-gutter border-b border-outline-variant/20 flex justify-between items-center bg-surface-container/50">
      <h2 class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest flex items-center gap-unit"><span class="ms text-primary-fixed-dim text-[16px]">movie</span> Hàng đợi Short</h2>
      <span id="liveDot" class="w-2.5 h-2.5 rounded-full bg-outline-variant"></span>
    </div>
    <div id="jobList" class="p-gutter flex-1 overflow-y-auto scrollbar-hide flex flex-col gap-stack-sm"></div>
  </section>
</main>

<script src="/web/shell.js"></script>
<script>
MKVShell('shorts','Short');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STAT={
  queued:['schedule','#849495','Trong hàng'],
  running:['progress_activity','#00dbe7','Đang xử lý'],
  ready:['fact_check','#bbc3ff','Chọn video'],
  done:['check_circle','#00e75b','Xong'],
  error:['error','#ffb4ab','Lỗi'],
};
const MODE={upload:'YouTube Short',probe:'Liệt kê video',download:'Tải về máy'};

// Luoi cac clip bat duoc (job probe da xong) — moi clip co poster + WxH + nut Tải / Up Short
function candGrid(j){
  const cs=j.candidates||[];
  if(!cs.length) return '<div class="text-on-surface-variant text-sm px-stack-sm pb-stack-sm">Không bắt được video nào.</div>';
  const cells=cs.map((c,i)=>{
    const res=(c.width&&c.height)?`${c.width}×${c.height}`:'? × ?';
    const star=c.primary?`<span class="ms text-[14px] text-warn" title="Đang hiển thị" style="font-variation-settings:'FILL' 1">star</span>`:'';
    const poster=c.poster?`<img src="${esc(c.poster)}" referrerpolicy="no-referrer" class="w-full h-32 object-cover rounded-t-lg bg-surface-container-lowest" onerror="this.style.display='none'"/>`
      :`<div class="w-full h-32 rounded-t-lg bg-surface-container-lowest flex items-center justify-center text-outline"><span class="ms text-[32px]">movie</span></div>`;
    const meta=encodeURIComponent(JSON.stringify({url:c.url,referer:c.referer||'',label:res}));
    return `<div class="bg-surface-container-high border border-outline-variant/30 rounded-lg overflow-hidden flex flex-col">
      ${poster}
      <div class="p-stack-sm flex flex-col gap-stack-sm">
        <div class="flex items-center justify-between">
          <span class="font-label-sm text-label-sm text-on-surface">#${i+1} ${star}</span>
          <span class="font-label-xs text-label-xs px-2 py-0.5 rounded-full bg-surface-variant text-on-surface-variant">${res}</span>
        </div>
        <div class="flex gap-stack-sm">
          <button data-grab="${meta}" data-gmode="download" class="flex-1 h-8 rounded-lg bg-primary-fixed-dim text-on-primary-fixed font-label-xs text-label-xs uppercase flex items-center justify-center gap-unit hover:bg-primary-fixed"><span class="ms text-[14px]">download</span> Tải</button>
          <button data-grab="${meta}" data-gmode="upload" class="flex-1 h-8 rounded-lg bg-surface-variant text-secondary font-label-xs text-label-xs uppercase flex items-center justify-center gap-unit hover:text-on-surface"><span class="ms text-[14px]">smart_display</span> Short</button>
        </div>
      </div></div>`;
  }).join('');
  return `<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-stack-sm px-stack-sm pb-stack-md">${cells}</div>`;
}

function jobCard(j){
  const [ic,col,lbl]=STAT[j.status]||STAT.queued;
  const modeLbl = MODE[j.mode]||'Tải về máy';
  const last = (j.log&&j.log.length)?j.log[j.log.length-1]:'';
  let action='';
  if(j.status==='done' && j.mode==='download')
    action=`<a href="/shorts/file/${j.id}" class="shrink-0 h-9 px-gutter rounded-lg bg-primary-fixed-dim text-on-primary-fixed font-label-sm text-label-sm uppercase flex items-center gap-unit hover:bg-primary-fixed"><span class="ms text-[16px]">download</span> Tải xuống</a>`;
  else if(j.status==='done' && j.mode==='upload' && j.video_url)
    action=`<a href="${esc(j.video_url)}" target="_blank" class="shrink-0 h-9 px-gutter rounded-lg bg-surface-variant text-secondary font-label-sm text-label-sm uppercase flex items-center gap-unit hover:text-on-surface"><span class="ms text-[16px]">open_in_new</span> Mở video</a>`;
  const title = esc(j.name || j.url);
  const sub = j.status==='error' ? `<span class="text-error">${esc(j.error||'lỗi')}</span>` : esc(last||modeLbl);
  const grid = (j.mode==='probe' && j.status==='ready') ? candGrid(j) : '';
  return `<div class="bg-surface-container border border-outline-variant/20 rounded-lg overflow-hidden">
    <div class="p-stack-md flex items-center justify-between gap-gutter">
      <div class="flex items-center gap-stack-md min-w-0">
        <span class="ms text-[22px] ${j.status==='running'?'animate-spin':''}" style="color:${col}">${ic}</span>
        <div class="flex flex-col min-w-0">
          <span class="text-on-surface text-sm truncate">${title}</span>
          <span class="font-label-xs text-label-xs text-on-surface-variant truncate">${esc(modeLbl)} · ${sub}</span>
        </div>
      </div>
      <div class="flex items-center gap-stack-sm shrink-0">
        <span class="font-label-xs text-label-xs px-2 py-1 rounded-full border" style="color:${col};border-color:${col}55">${lbl}</span>
        ${action}
        <button data-del="${j.id}" class="w-8 h-8 rounded-lg text-on-surface-variant hover:text-error hover:bg-error-container/10 flex items-center justify-center" title="Xoá"><span class="ms text-[18px]">close</span></button>
      </div>
    </div>
    ${grid}
  </div>`;
}

async function refresh(){
  let d; try{ d=await (await fetch('/shorts/status',{cache:'no-store'})).json(); }catch(e){ return; }
  $('liveDot').className='w-2.5 h-2.5 rounded-full '+(d.running?'bg-primary-fixed-dim shadow-[0_0_5px_#00dbe7]':'bg-outline-variant');
  const jobs=d.jobs||[];
  $('jobList').innerHTML = jobs.length ? jobs.map(jobCard).join('')
    : '<div class="text-on-surface-variant text-sm text-center py-stack-lg">Chưa có job nào — dán link rồi bấm Liệt kê video để xem các clip, hoặc Tải/Up nhanh.</div>';
}

async function enqueue(mode){
  const v=$('links').value.trim(); if(!v) return;
  $('btnProbe').disabled=true;
  const f=new FormData(); f.append('url',v); f.append('mode',mode);
  try{ await fetch('/shorts/enqueue',{method:'POST',body:f}); }catch(e){}
  $('links').value=''; $('btnProbe').disabled=false;
  setTimeout(refresh,300);
}
$('btnProbe').addEventListener('click',()=>enqueue('probe'));

$('jobList').addEventListener('click',async e=>{
  const del=e.target.closest('[data-del]');
  if(del){
    const f=new FormData(); f.append('jid',del.dataset.del);
    try{ await fetch('/shorts/delete',{method:'POST',body:f}); }catch(e){}
    return refresh();
  }
  const grab=e.target.closest('[data-grab]');
  if(grab){
    let m; try{ m=JSON.parse(decodeURIComponent(grab.dataset.grab)); }catch(e){ return; }
    grab.disabled=true;
    const f=new FormData();
    f.append('media_url',m.url); f.append('referer',m.referer||''); f.append('label',m.label||'');
    f.append('mode',grab.dataset.gmode||'download');
    try{ await fetch('/shorts/grab',{method:'POST',body:f}); }catch(e){}
    setTimeout(refresh,300);
  }
});

setInterval(refresh,2000); refresh();
</script>
</body></html>
