<!DOCTYPE html>
<html class="dark" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MKVTOOLS — Command Center</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@20..48,100..700,0..1&display=swap" rel="stylesheet"/>
<script>
  tailwind.config = { darkMode: "class", theme: { extend: {
    colors: {
      "surface-container-low":"#1c1b1d","surface-container-highest":"#353437","surface-container":"#201f21",
      "surface-container-high":"#2a2a2c","surface-container-lowest":"#0e0e10","surface-variant":"#353437",
      "primary-container":"#00f2ff","on-surface":"#e5e1e4","on-background":"#e5e1e4","background":"#131315",
      "surface":"#131315","outline":"#849495","outline-variant":"#3a494b","on-surface-variant":"#b9cacb",
      "primary-fixed-dim":"#00dbe7","primary-fixed":"#74f5ff","on-primary-fixed":"#002022",
      "error":"#ffb4ab","error-container":"#93000a","secondary":"#bbc3ff",
      "ok":"#00e75b","warn":"#f5b32b","split":"#d1bcff"
    },
    borderRadius:{ "DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px" },
    spacing:{ "unit":"4px","stack-sm":"8px","gutter":"16px","stack-md":"16px","panel-padding":"24px","stack-lg":"32px","container-margin":"32px" },
    fontFamily:{ "headline-md":["Sora"],"headline-lg":["Sora"],"body-md":["Inter"],"label-sm":["JetBrains Mono"],"label-xs":["JetBrains Mono"] },
    fontSize:{
      "label-xs":["10px",{lineHeight:"12px",letterSpacing:"0.1em",fontWeight:"700"}],
      "label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"500"}],
      "body-md":["15px",{lineHeight:"22px",fontWeight:"400"}],
      "headline-md":["22px",{lineHeight:"30px",fontWeight:"600"}],
      "headline-lg":["30px",{lineHeight:"38px",letterSpacing:"-0.01em",fontWeight:"700"}]
    }
  }}}
</script>
<style>
  .glass-panel{background:linear-gradient(135deg,rgba(20,20,23,.8),rgba(10,10,12,.9));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(58,73,75,.3);border-top-color:rgba(255,255,255,.05);border-left-color:rgba(255,255,255,.05)}
  .neon-glow{box-shadow:0 0 12px rgba(0,242,255,.3)}
  .neon-text-glow{text-shadow:0 0 8px rgba(0,242,255,.5)}
  .input-glow:focus-within{box-shadow:0 2px 12px -2px rgba(0,242,255,.4);border-color:#00f2ff}
  .scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
  @keyframes shimmer{100%{transform:translateX(100%)}}
  .ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}
</style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-fixed">

<nav id="shell-side" class="w-[280px] h-screen fixed left-0 top-0 bg-surface-container-low border-r border-outline-variant/30 shadow-2xl z-50 flex flex-col py-panel-padding"></nav>
<header id="shell-top" class="fixed top-0 right-0 left-[280px] h-16 bg-surface/70 backdrop-blur-md border-b border-outline-variant/20 z-40 flex items-center justify-between px-container-margin"></header>

<!-- Main -->
<main class="ml-[280px] mt-16 p-container-margin h-[calc(100vh-64px)] overflow-y-auto scrollbar-hide bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-low via-background to-background">

  <!-- Stats -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-stack-md mb-stack-lg">
    <div class="glass-panel p-panel-padding rounded-xl flex items-center justify-between">
      <div><p class="font-label-xs text-label-xs text-on-surface-variant uppercase mb-unit">Đĩa trống</p>
        <p class="font-headline-lg text-headline-lg text-on-surface"><span id="diskFree">—</span> <span class="font-body-md text-on-surface-variant">GB</span></p></div>
      <div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-fixed-dim"><span class="ms">hard_drive</span></div>
    </div>
    <div class="glass-panel p-panel-padding rounded-xl flex items-center justify-between">
      <div><p class="font-label-xs text-label-xs text-on-surface-variant uppercase mb-unit">Đang xử lý / chờ</p>
        <p class="font-headline-lg text-headline-lg text-primary-fixed-dim neon-text-glow"><span id="statRun">0</span> <span class="font-body-md text-on-surface-variant">/ <span id="statWait">0</span></span></p></div>
      <div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary-fixed-dim"><span class="ms">memory</span></div>
    </div>
    <div class="glass-panel p-panel-padding rounded-xl flex items-center justify-between">
      <div><p class="font-label-xs text-label-xs text-on-surface-variant uppercase mb-unit">Đã xong</p>
        <p class="font-headline-lg text-headline-lg text-on-surface"><span id="statDone">0</span></p></div>
      <div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-ok"><span class="ms">check_circle</span></div>
    </div>
  </div>

  <!-- Input -->
  <div class="mb-stack-lg glass-panel p-panel-padding rounded-xl relative overflow-hidden">
    <div class="absolute top-0 left-0 w-1 h-full bg-primary-fixed-dim shadow-[0_0_15px_#00dbe7]"></div>
    <form id="addForm" class="relative z-10">
      <label class="font-label-xs text-label-xs text-primary-fixed-dim uppercase tracking-widest">Dán link — mỗi dòng 1 link (YouTube · trang phim · Google Drive · .mkv/.mp4 · magnet) — hoặc upload file .torrent</label>
      <textarea id="links" rows="3" class="mt-stack-sm w-full input-glow border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md p-gutter focus:ring-0 placeholder-on-surface-variant/40 resize-none" placeholder="https://...&#10;https://..."></textarea>
      <div class="mt-stack-sm flex items-center justify-between flex-wrap gap-stack-sm">
        <span class="font-label-xs text-label-xs text-on-surface-variant">upload: bật · xoá nguồn sau khi đăng (rotation)</span>
        <div class="flex items-center gap-stack-sm">
          <button type="button" id="torrentBtn" class="h-11 px-gutter border border-outline-variant text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider rounded-lg hover:border-primary-fixed-dim hover:text-primary-fixed-dim transition-colors flex items-center gap-unit">
            <span class="ms text-[18px]">upload_file</span> File .torrent</button>
          <button type="submit" class="h-11 px-stack-lg bg-primary-fixed-dim text-on-primary-fixed font-label-sm text-label-sm uppercase tracking-wider rounded-lg hover:bg-primary-fixed transition-colors flex items-center gap-unit shadow-[0_0_15px_rgba(0,219,231,.4)]">
            <span class="ms text-[18px]" style="font-variation-settings:'FILL' 1">add</span> Thêm vào hàng đợi</button>
        </div>
      </div>
    </form>
    <input type="file" id="torrentFile" accept=".torrent" multiple class="hidden"/>
  </div>

  <!-- Bento -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-stack-lg">
    <div class="lg:col-span-2 flex flex-col gap-stack-lg">
      <section class="glass-panel rounded-xl overflow-hidden flex flex-col max-h-[420px]">
        <div class="px-panel-padding py-gutter border-b border-outline-variant/20 flex justify-between items-center bg-surface-container/50">
          <h2 class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest flex items-center gap-unit"><span class="ms text-primary-fixed-dim text-[16px]">hourglass_top</span> Đang xử lý &amp; hàng chờ</h2>
          <span id="qCount" class="font-label-xs text-label-xs bg-surface-variant text-on-surface-variant px-2 py-1 rounded-full">0</span>
        </div>
        <div id="queueList" class="p-gutter flex-1 overflow-y-auto scrollbar-hide flex flex-col gap-stack-sm"></div>
      </section>

      <section class="glass-panel rounded-xl overflow-hidden flex flex-col flex-1 min-h-[260px]">
        <div class="px-panel-padding py-gutter border-b border-outline-variant/20 flex justify-between items-center bg-surface-container/50">
          <h2 class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest flex items-center gap-unit"><span class="ms text-outline text-[16px]">history</span> Lịch sử</h2>
        </div>
        <div id="histList" class="p-gutter flex-1 overflow-y-auto scrollbar-hide flex flex-col gap-unit"></div>
      </section>
    </div>

    <section class="glass-panel rounded-xl overflow-hidden flex flex-col h-full min-h-[400px] bg-[#0a0a0c]/90 border-[#252529]">
      <div class="px-panel-padding py-gutter border-b border-[#252529] flex justify-between items-center bg-[#141417]/80">
        <h2 class="font-label-sm text-label-sm text-on-surface uppercase tracking-widest flex items-center gap-unit"><span class="ms text-primary-fixed-dim text-[16px]">terminal</span> Nhật ký</h2>
        <div class="flex gap-1.5"><div class="w-2.5 h-2.5 rounded-full bg-outline-variant"></div><div class="w-2.5 h-2.5 rounded-full bg-outline-variant"></div><div id="liveDot" class="w-2.5 h-2.5 rounded-full bg-outline-variant"></div></div>
      </div>
      <div id="logBox" class="p-gutter flex-1 overflow-y-auto scrollbar-hide font-label-xs text-label-xs leading-relaxed text-[#849495]"></div>
    </section>
  </div>
</main>

<script src="/web/shell.js"></script>
<script>
MKVShell('queue','Hàng đợi');
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function baseName(u){ try{ u=decodeURIComponent(u.split('?')[0]); }catch(e){} const p=u.split('/').filter(Boolean); return p.length?p[p.length-1]:u; }
function lastPct(log){ for(let i=log.length-1;i>=0 && i>log.length-12;i--){ const m=/(\d{1,3})\s*%/.exec(log[i]); if(m) return Math.min(100,+m[1]); } return null; }

// badge trang thai lich su
function histRow(h){
  const map={done:['check_circle','#00e75b'],error:['error','#ffb4ab'],title:['block','#f5b32b'],true:['block','#f5b32b']};
  const [ic,col]=map[h.status]||['radio_button_unchecked','#849495'];
  const sub = h.status==='error' ? `<span style="color:#ffb4ab">${esc(h.error||'lỗi')}</span>` :
              h.status==='done' ? 'Hoàn tất' : 'Bỏ qua (đã có)';
  return `<div class="flex items-center justify-between p-stack-sm rounded hover:bg-surface-container transition-colors">
    <div class="flex items-center gap-stack-md min-w-0"><span class="ms text-[18px]" style="color:${col}">${ic}</span>
    <div class="flex flex-col min-w-0"><span class="text-on-surface text-sm truncate">${esc(h.name||baseName(h.url))}</span>
    <span class="font-label-xs text-label-xs text-on-surface-variant">${sub}</span></div></div></div>`;
}

function currentCard(name, pct, logLine){
  const bar = pct!=null
    ? `<div class="bg-primary-fixed-dim h-full rounded-full shadow-[0_0_10px_#00dbe7]" style="width:${pct}%"></div>`
    : `<div class="bg-primary-fixed-dim h-full rounded-full w-1/3 relative"><div class="absolute inset-0 bg-gradient-to-r from-transparent to-white/40 animate-[shimmer_1.2s_infinite]"></div></div>`;
  return `<div class="bg-surface-container-high rounded-lg p-stack-md border border-outline-variant/30 relative overflow-hidden">
    <div class="absolute left-0 top-0 w-1 h-full bg-primary-fixed-dim"></div>
    <div class="flex justify-between items-start mb-stack-sm gap-gutter">
      <div class="min-w-0"><h3 class="text-on-surface truncate">${esc(name)}</h3>
      <p class="font-label-xs text-label-xs text-on-surface-variant mt-1 truncate">${esc(logLine||'đang xử lý...')}</p></div>
      <span class="shrink-0 font-label-xs text-label-xs bg-primary-container/10 text-primary-fixed-dim px-2 py-1 rounded-full border border-primary-fixed-dim/30 animate-pulse">Đang xử lý${pct!=null?(' '+pct+'%'):''}</span>
    </div>
    <div class="w-full bg-surface-container-lowest h-1.5 rounded-full overflow-hidden">${bar}</div></div>`;
}
function queuedCard(u){
  return `<div class="bg-surface-container border border-outline-variant/20 rounded-lg p-stack-md opacity-70 hover:opacity-100 transition-opacity">
    <div class="flex justify-between items-center gap-gutter"><h3 class="text-on-surface truncate min-w-0">${esc(baseName(u))}</h3>
    <span class="shrink-0 font-label-xs text-label-xs bg-surface-variant text-on-surface-variant px-2 py-1 rounded-full border border-outline-variant/30">Trong hàng</span></div></div>`;
}
function logLineHTML(s){
  let col='#849495';
  if(/\[OK\]|XONG|da xoa nguon|uploaded/i.test(s)) col='#00e75b';
  else if(/\[LOI\]|loi|error|!/i.test(s)) col='#ffb4ab';
  else if(/\[tai\]|tach|upload|split/i.test(s)) col='#bbc3ff';
  return `<div class="mb-1" style="color:${col}">${esc(s)}</div>`;
}

async function refresh(){
  let d; try{ d=await (await fetch('/queue',{cache:'no-store'})).json(); }catch(e){ return; }
  const free = d.disk_free_gb!=null ? d.disk_free_gb : '—';
  $('diskFree').textContent=free; const _dk=$('shell-diskv'); if(_dk)_dk.textContent=free+' GB';
  const running = d.current?1:0;
  $('statRun').textContent=running; $('statWait').textContent=(d.pending||[]).length;
  $('statDone').textContent=(d.history||[]).filter(h=>h.status==='done').length;
  $('qCount').textContent=running+(d.pending||[]).length;
  $('liveDot').className='w-2.5 h-2.5 rounded-full '+(d.running?'bg-primary-fixed-dim shadow-[0_0_5px_#00dbe7]':'bg-outline-variant');

  const pct=lastPct(d.log||[]);
  const last=(d.log||[]).slice(-1)[0]||'';
  let q='';
  if(d.current) q+=currentCard(baseName(d.current),pct,last);
  (d.pending||[]).forEach(u=>q+=queuedCard(u));
  $('queueList').innerHTML = q || '<div class="text-on-surface-variant text-sm text-center py-stack-lg">Hàng đợi trống — dán link phía trên để bắt đầu.</div>';

  const hist=(d.history||[]).slice().reverse();
  $('histList').innerHTML = hist.length ? hist.map(histRow).join('') : '<div class="text-on-surface-variant text-sm text-center py-stack-md">Chưa có việc nào.</div>';

  $('logBox').innerHTML=(d.log||[]).slice(-200).map(logLineHTML).join('') || '<div class="text-on-surface-variant">(chưa có log)</div>';
  $('logBox').scrollTop=$('logBox').scrollHeight;
}

$('addForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const v=$('links').value.trim(); if(!v) return;
  const btn=e.submitter; if(btn){btn.disabled=true;}
  const f=new FormData(); f.append('links',v);
  await fetch('/enqueue',{method:'POST',body:f});
  $('links').value=''; if(btn){btn.disabled=false;}
  setTimeout(refresh,300);
});
$('torrentBtn').addEventListener('click',()=>$('torrentFile').click());
$('torrentFile').addEventListener('change',async e=>{
  const files=e.target.files; if(!files.length) return;
  const btn=$('torrentBtn'); btn.disabled=true;
  const f=new FormData(); for(const t of files) f.append('files',t);
  try{ await fetch('/enqueue-torrent',{method:'POST',body:f}); }catch(err){}
  e.target.value=''; btn.disabled=false;
  setTimeout(refresh,300);
});
setInterval(refresh,2000); refresh();
</script>
</body></html>
